<style>
  :root{
    --ink:#0E151E; --panel:#16212E; --row:#1B2836; --row-hi:#213142;
    --border:#26374A; --border-soft:#1E2C3B;
    --text:#C7D3E0; --dim:#7C8DA0; --faint:#556478;
    --req:#F0B429; --req-soft:#3a2f14; --req-line:#F0B429;
    --accent:#4C9AFF; --accent-ink:#0b3a7a;
    --teal:#54D0C0; --danger:#FF6B6B;
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.5;
    background-image:radial-gradient(1200px 600px at 80% -10%, #13202e 0%, transparent 60%);
  }
  .app{display:flex; flex-direction:column; min-height:100%}

  /* ---- top bar ---- */
  header{
    display:flex; align-items:baseline; gap:16px; padding:16px 22px;
    border-bottom:1px solid var(--border-soft);
  }
  .logo{font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:.02em; color:var(--text)}
  .logo b{color:var(--req)}
  .tag{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.14em; text-transform:uppercase}
  header .spacer{flex:1}
  .airgap{font-family:var(--mono); font-size:11px; color:var(--dim); border:1px solid var(--border); border-radius:999px; padding:3px 10px}
  .airgap span{color:var(--teal)}

  /* ---- layout ---- */
  main{display:grid; grid-template-columns:minmax(360px,1.05fr) minmax(340px,.95fr); gap:1px; background:var(--border-soft); flex:1; min-height:0}
  .col{background:var(--ink); display:flex; flex-direction:column; min-width:0}
  .col-head{display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--border-soft)}
  .col-head h2{margin:0; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); font-weight:600; font-family:var(--mono)}
  .col-head .spacer{flex:1}
  .col-body{padding:16px 18px; overflow:auto; flex:1; min-height:0}

  /* ---- input ---- */
  textarea{
    width:100%; min-height:220px; resize:vertical; background:var(--panel);
    color:var(--text); border:1px solid var(--border); border-radius:8px;
    font-family:var(--mono); font-size:12.5px; line-height:1.6; padding:12px 14px; tab-size:2;
  }
  textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(76,154,255,.12)}
  .controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  button, .filebtn{
    font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer;
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:8px 14px; transition:border-color .12s, background .12s;
  }
  button:hover,.filebtn:hover{border-color:var(--accent); background:var(--row-hi)}
  button.primary{background:var(--accent-ink); border-color:var(--accent); color:#eaf2ff}
  button.primary:hover{background:#0d4694}
  button:disabled{opacity:.4; cursor:not-allowed}
  .filebtn{display:inline-flex; align-items:center; gap:7px}
  .filebtn input{display:none}
  .drop{border:1px dashed var(--border); border-radius:8px; padding:14px; text-align:center; color:var(--dim); font-size:12.5px; margin-top:10px}
  .drop.hot{border-color:var(--accent); color:var(--accent); background:rgba(76,154,255,.06)}
  .err{color:var(--danger); font-family:var(--mono); font-size:12.5px; margin-top:12px; white-space:pre-wrap}

  /* ---- meta / selectors ---- */
  .meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .chip{font-family:var(--mono); font-size:11.5px; padding:4px 9px; border-radius:6px; border:1px solid var(--border); color:var(--dim)}
  .chip b{color:var(--text); font-weight:600}
  .selects{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end}
  .field label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:5px}
  select{background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-family:var(--mono); font-size:12.5px}
  select:focus{outline:none; border-color:var(--accent)}
  .storage-tag{font-family:var(--mono); font-size:10px; color:var(--teal); border:1px solid var(--teal); border-radius:5px; padding:2px 6px}

  /* ---- toolbar ---- */
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .search{flex:1; min-width:140px; background:var(--panel); border:1px solid var(--border); border-radius:7px; padding:7px 11px; color:var(--text); font-family:var(--mono); font-size:12.5px}
  .search:focus{outline:none; border-color:var(--accent)}
  .toggle{display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden}
  .toggle button{border:0; border-radius:0; background:transparent; padding:7px 12px; font-size:12px; color:var(--dim)}
  .toggle button.on{background:var(--req-soft); color:var(--req)}
  .count{font-family:var(--mono); font-size:11.5px; color:var(--dim)}
  .count b{color:var(--req)}

  /* ---- tree ---- */
  .tree{font-family:var(--mono); font-size:12.5px}
  .node{border-left:2px solid transparent}
  .node.req{border-left-color:var(--req-line)}
  .rowline{display:flex; align-items:flex-start; gap:8px; padding:4px 8px; border-radius:6px; cursor:default}
  .rowline:hover{background:var(--row)}
  .twist{width:14px; color:var(--faint); cursor:pointer; user-select:none; flex:none; text-align:center}
  .twist.leaf{visibility:hidden}
  .nm{color:var(--text)}
  .nm.req{color:var(--req); font-weight:600}
  .ty{color:var(--teal); opacity:.85}
  .ty.arr{color:#9db4d0}
  .badge{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--req); border:1px solid var(--req); border-radius:4px; padding:1px 5px; flex:none}
  .attr{color:var(--faint)}
  .attr b{color:var(--dim); font-weight:400}
  .desc{color:var(--dim); font-style:italic}
  .kids{margin-left:14px}
  .hidden{display:none}
  .empty{color:var(--dim); font-family:var(--mono); font-size:12.5px; padding:20px 0}

  /* ---- manifest output ---- */
  .mf-toggle{margin-left:6px}
  .mf-toggle button{padding:5px 10px; font-size:11.5px}
  .mf-cap{font-family:var(--mono); font-size:11px; color:var(--faint); margin:0 0 8px; line-height:1.4}
  pre.out{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.65; overflow:auto; margin:0; white-space:pre; tab-size:2}
  pre.out .c{color:var(--faint)}
  .out-head{display:flex; align-items:center; gap:10px; margin:18px 0 8px}
  .out-head h3{margin:0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:600; font-family:var(--mono)}
  .out-head .spacer{flex:1}
  .mini{font-size:12px; padding:5px 10px}
  .flatlist{font-family:var(--mono); font-size:12px; margin-top:6px}
  .flatlist .fl{display:flex; gap:8px; padding:3px 0; border-bottom:1px solid var(--border-soft)}
  .flatlist .fl .p{color:var(--req)}
  .flatlist .fl .t{color:var(--teal); margin-left:auto; opacity:.8}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent-ink); border:1px solid var(--accent); color:#eaf2ff; padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; font-family:var(--mono)}
  .toast.show{opacity:1}

  .placeholder{color:var(--dim); text-align:center; padding:60px 20px; font-size:13px}
  .placeholder .big{font-size:40px; margin-bottom:14px; opacity:.5}

  @media (max-width:860px){ main{grid-template-columns:1fr} .col:first-child{border-bottom:1px solid var(--border-soft)} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><b>crd</b>·decoder</div>
    <div class="tag">mandatory field explorer</div>
    <div class="spacer"></div>
  </header>

  <main>
    <!-- LEFT: input + tree -->
    <section class="col">
      <div class="col-head"><h2>Source</h2><div class="spacer"></div></div>
      <div class="col-body">
        <textarea id="src" spellcheck="false" placeholder="Paste a CustomResourceDefinition (YAML or JSON). Multi-document files and multiple CRDs are supported."></textarea>
        <div class="controls">
          <button class="primary" id="parseBtn">Inspect</button>
          <label class="filebtn">📄 Upload CRD<input type="file" id="file" accept=".yaml,.yml,.json,.txt"></label>
          <button id="sampleBtn">Load sample</button>
          <button id="clearBtn">Clear</button>
        </div>
        <div class="drop" id="drop">…or drop a .yaml / .json file here</div>
        <div class="err" id="err"></div>

        <div id="result" class="hidden" style="margin-top:20px">
          <div class="meta" id="meta"></div>
          <div class="selects" id="selects"></div>

          <div class="toolbar">
            <input class="search" id="search" placeholder="filter fields…">
            <div class="toggle">
              <button id="tgAll" class="on">All</button>
              <button id="tgReq">Required only</button>
            </div>
            <span class="count" id="count"></span>
          </div>
          <div class="tree" id="tree"></div>
        </div>
      </div>
    </section>

    <!-- RIGHT: outputs -->
    <section class="col">
      <div class="col-head"><h2>Output</h2><div class="spacer"></div></div>
      <div class="col-body" id="outbody">
        <div class="placeholder" id="outPlaceholder">
          <div class="big">◇</div>
          Inspect a CRD to see its required fields<br>and a minimal valid manifest.
        </div>
        <div id="outContent" class="hidden">
          <div class="out-head">
            <h3>Manifest</h3>
            <div class="toggle mf-toggle">
              <button id="mfMin" class="on">Minimal</button>
              <button id="mfAll">All required</button>
            </div>
            <div class="spacer"></div>
            <button class="mini" id="copyYaml">Copy YAML</button>
          </div>
          <div class="mf-cap" id="mfCap"></div>
          <pre class="out" id="manifest"></pre>

          <div class="out-head">
            <h3>Required fields · <span id="flatCount"></span></h3>
            <div class="spacer"></div>
            <button class="mini" id="copyList">Copy list</button>
          </div>
          <div class="flatlist" id="flat"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};

let STATE = { crds:[], ci:0, vi:0, mode:'all', q:'', manifestMode:'minimal' };

// ---------- parsing ----------
function walk(schema, name, path, required){
  schema = schema || {};
  let type = schema.type;
  if(!type){
    if(schema.properties) type='object';
    else if(schema['x-kubernetes-preserve-unknown-fields']) type='object · free-form';
    else if(schema['x-kubernetes-int-or-string']) type='int-or-string';
    else type='any';
  }
  const node = {
    name, path, type,
    required: !!required,
    description: schema.description,
    def: schema.default,
    enm: schema.enum,
    format: schema.format,
    min: schema.minimum, max: schema.maximum,
    pattern: schema.pattern,
    children: [], open:true,
  };
  const reqSet = new Set(schema.required || []);
  (schema.allOf||[]).forEach(s=> (s.required||[]).forEach(r=>reqSet.add(r)));
  // conditional combinators flagged for the reader
  node.conditional = !!(schema.oneOf||schema.anyOf);

  if(schema.properties){
    for(const k of Object.keys(schema.properties)){
      node.children.push(walk(schema.properties[k], k, path?path+'.'+k:k, reqSet.has(k)));
    }
  }
  if(type==='array' && schema.items && typeof schema.items==='object'){
    const item = walk(schema.items, '[ ]', path+'[]', false);
    item.isItem = true;
    node.children.push(item);
  }
  if(schema.additionalProperties && typeof schema.additionalProperties==='object'){
    const ap = walk(schema.additionalProperties, '<key>', path+'{}', false);
    ap.isMapVal = true;
    node.children.push(ap);
  }
  return node;
}

function parseCRDs(text){
  let docs;
  try { docs = jsyaml.loadAll(text); }
  catch(e){ throw new Error('YAML/JSON parse error:\n'+ (e.reason||e.message)); }
  docs = docs.filter(d=>d && typeof d==='object');
  const crds=[];
  for(const d of docs){
    if(d.kind!=='CustomResourceDefinition') continue;
    if(!d.spec||!d.spec.names){ continue; }
    const group=d.spec.group, kind=d.spec.names.kind;
    const versions=(d.spec.versions||[]).map(v=>({
      name:v.name, served:v.served, storage:v.storage,
      tree: (v.schema&&v.schema.openAPIV3Schema)? walk(v.schema.openAPIV3Schema, kind, '', false): null,
    }));
    crds.push({ group, kind, scope:d.spec.scope||'Namespaced', plural:d.spec.names.plural, versions });
  }
  if(!crds.length){
    if(docs.length) throw new Error('No CustomResourceDefinition found.\nParsed '+docs.length+' document(s) but none had kind: CustomResourceDefinition.');
    throw new Error('Nothing to inspect — input was empty.');
  }
  return crds;
}

// ---------- required-only helpers ----------
function requiredLeaves(node, acc){
  acc = acc||[];
  for(const c of node.children){
    if(c.required) acc.push(c);
    requiredLeaves(c, acc);
  }
  return acc;
}
function countRequired(node){ return requiredLeaves(node).length; }

// ---------- minimal manifest ----------
function hasRequiredDescendant(node){
  return node.children.some(c=> c.required || hasRequiredDescendant(c));
}
// minimal: only fields required by the parent.
// full: also expand optional containers that hold a required field somewhere below.
function include(node, mode){
  return mode==='full' ? (node.required || hasRequiredDescendant(node)) : node.required;
}
function sampleValue(node, mode){
  if(node.enm && node.enm.length) return node.enm[0];
  if(node.def!==undefined) return node.def;
  const t=node.type;
  if(t.startsWith('object')){
    const o={};
    for(const c of node.children){ if(include(c, mode)) o[c.name]=sampleValue(c, mode); }
    return o;
  }
  if(t==='array'){
    const item=node.children.find(c=>c.isItem);
    if(item) return [ sampleValue(item, mode) ];
    return [];
  }
  if(t==='integer'||t==='number') return node.min!==undefined?node.min:0;
  if(t==='boolean') return false;
  if(t==='int-or-string') return '0';
  return '<'+ (node.name||'value') +'>';
}

function buildManifest(crd, ver, mode){
  mode = mode || 'minimal';
  const m={ apiVersion: crd.group+'/'+ver.name, kind: crd.kind, metadata:{ name:'example' } };
  if(crd.scope==='Namespaced') m.metadata.namespace='default';
  if(ver.tree){
    for(const c of ver.tree.children){
      if(['apiVersion','kind','metadata'].includes(c.name)) continue;
      if(include(c, mode)) m[c.name]=sampleValue(c, mode);
    }
  }
  return jsyaml.dump(m, {noRefs:true, lineWidth:-1});
}

// ---------- rendering ----------
function matches(node, q){
  if(!q) return true;
  if(node.name.toLowerCase().includes(q) || node.path.toLowerCase().includes(q)) return true;
  return node.children.some(c=>matches(c,q));
}
function hasVisible(node, mode, q){
  // a node is visible if it (or a descendant) passes both filters
  const self = (mode==='all'||node.required) && matches(node,q);
  if(self) return true;
  return node.children.some(c=>hasVisible(c,mode,q));
}

function renderNode(node, mode, q, depth){
  if(!hasVisible(node, mode, q)) return null;
  const wrap = el('div','node'+(node.required?' req':''));
  const row = el('div','rowline');

  const hasKids = node.children.length>0;
  const twist = el('span','twist'+(hasKids?'':' leaf'), hasKids?(node.open?'▾':'▸'):'·');
  if(hasKids){ twist.onclick=()=>{ node.open=!node.open; draw(); }; }
  row.appendChild(twist);

  const nm = el('span','nm'+(node.required?' req':''), node.name);
  row.appendChild(nm);

  const ty = el('span','ty'+(node.type==='array'?' arr':''), ' '+node.type);
  row.appendChild(ty);

  if(node.required){ row.appendChild(el('span','badge','required')); }
  if(node.conditional){ const b=el('span','badge','oneOf'); b.style.color='#9db4d0'; b.style.borderColor='#3a4a5e'; row.appendChild(b); }

  const bits=[];
  if(node.enm) bits.push('enum: '+node.enm.slice(0,5).join('|')+(node.enm.length>5?'…':''));
  if(node.def!==undefined) bits.push('default: '+JSON.stringify(node.def));
  if(node.format) bits.push('format: '+node.format);
  if(node.min!==undefined) bits.push('min: '+node.min);
  if(node.max!==undefined) bits.push('max: '+node.max);
  if(bits.length){ const a=el('span','attr',' · '+bits.join(' · ')); row.appendChild(a); }

  wrap.appendChild(row);

  if(node.description){
    const d=el('div','desc', node.description.length>160?node.description.slice(0,160)+'…':node.description);
    d.style.marginLeft='22px'; wrap.appendChild(d);
  }

  if(hasKids && node.open){
    const kids=el('div','kids');
    for(const c of node.children){
      const r=renderNode(c, mode, q, depth+1);
      if(r) kids.appendChild(r);
    }
    wrap.appendChild(kids);
  }
  return wrap;
}

function draw(){
  const crd=STATE.crds[STATE.ci];
  const ver=crd.versions[STATE.vi];
  // meta chips
  const meta=$('#meta'); meta.innerHTML='';
  const mk=(k,v)=>{const c=el('span','chip'); c.innerHTML=k+' <b>'+v+'</b>'; return c;};
  meta.appendChild(mk('kind', crd.kind));
  meta.appendChild(mk('apiVersion', crd.group+'/'+ver.name));
  meta.appendChild(mk('scope', crd.scope));
  if(ver.tree) meta.appendChild(mk('required fields', countRequired(ver.tree)));

  // selectors
  const sel=$('#selects'); sel.innerHTML='';
  if(STATE.crds.length>1){
    const f=el('div','field'); f.appendChild(el('label',null,'CRD'));
    const s=el('select'); STATE.crds.forEach((c,i)=>{const o=el('option',null,c.kind+' ('+c.group+')'); o.value=i; if(i===STATE.ci)o.selected=true; s.appendChild(o);});
    s.onchange=e=>{STATE.ci=+e.target.value; STATE.vi=0; draw();};
    f.appendChild(s); sel.appendChild(f);
  }
  if(crd.versions.length>1){
    const f=el('div','field'); f.appendChild(el('label',null,'Version'));
    const s=el('select'); crd.versions.forEach((v,i)=>{const o=el('option',null,v.name+(v.storage?' (storage)':'')); o.value=i; if(i===STATE.vi)o.selected=true; s.appendChild(o);});
    s.onchange=e=>{STATE.vi=+e.target.value; draw();};
    f.appendChild(s); sel.appendChild(f);
  }
  if(ver.storage){ const t=el('span','storage-tag','● storage version'); const f=el('div','field'); f.appendChild(el('label',null,'\u00a0')); f.appendChild(t); sel.appendChild(f); }

  // count
  $('#count').innerHTML = ver.tree ? '<b>'+countRequired(ver.tree)+'</b> required · '+(ver.tree.children.length? '' : '')+'' : 'no schema';

  // tree
  const tree=$('#tree'); tree.innerHTML='';
  if(!ver.tree){ tree.appendChild(el('div','empty','This version has no openAPIV3Schema (structural schema not defined).')); }
  else {
    let any=false;
    for(const c of ver.tree.children){
      const r=renderNode(c, STATE.mode, STATE.q, 0);
      if(r){ tree.appendChild(r); any=true; }
    }
    if(!any) tree.appendChild(el('div','empty','No fields match the current filter.'));
  }

  // outputs
  const oc=$('#outContent'), op=$('#outPlaceholder');
  if(ver.tree){
    op.classList.add('hidden'); oc.classList.remove('hidden');
    $('#mfMin').classList.toggle('on', STATE.manifestMode==='minimal');
    $('#mfAll').classList.toggle('on', STATE.manifestMode==='full');
    $('#mfCap').textContent = STATE.manifestMode==='minimal'
      ? 'Only top-level required fields — the smallest CR the API will accept.'
      : 'Every required field, expanding optional parents that contain one.';
    const raw=buildManifest(crd, ver, STATE.manifestMode);
    $('#manifest').innerHTML = raw.split('\n').map(line=>{
      const v=line.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return v.includes('&lt;') ? '<span class="c">'+v+'</span>' : v;
    }).join('\n');
    const leaves=requiredLeaves(ver.tree).filter(n=>!n.type.startsWith('object')||n.children.every(c=>!c.required));
    // show all required paths (including object containers) for completeness
    const all=requiredLeaves(ver.tree);
    $('#flatCount').textContent=all.length;
    const fl=$('#flat'); fl.innerHTML='';
    if(!all.length) fl.appendChild(el('div','empty','No required fields declared.'));
    all.forEach(n=>{ const r=el('div','fl'); r.appendChild(el('span','p', n.path)); r.appendChild(el('span','t', n.type)); fl.appendChild(r); });
  } else { oc.classList.add('hidden'); op.classList.remove('hidden'); }
}

// ---------- actions ----------
function inspect(text){
  const err=$('#err'); err.textContent='';
  try{
    STATE.crds=parseCRDs(text); STATE.ci=0; STATE.vi=0;
    // default to storage version if present
    const sv=STATE.crds[0].versions.findIndex(v=>v.storage); if(sv>0) STATE.vi=sv;
    $('#result').classList.remove('hidden');
    draw();
  }catch(e){
    $('#result').classList.add('hidden');
    $('#outContent').classList.add('hidden'); $('#outPlaceholder').classList.remove('hidden');
    err.textContent=e.message;
  }
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }
function copy(text,msg){ navigator.clipboard.writeText(text).then(()=>toast(msg||'Copied')).catch(()=>{
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg||'Copied');
});}

// ---------- wire up ----------
$('#parseBtn').onclick=()=>inspect($('#src').value);
$('#clearBtn').onclick=()=>{ $('#src').value=''; $('#err').textContent=''; $('#result').classList.add('hidden'); $('#outContent').classList.add('hidden'); $('#outPlaceholder').classList.remove('hidden'); };
$('#sampleBtn').onclick=()=>{ $('#src').value=SAMPLE; inspect(SAMPLE); };
$('#file').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{$('#src').value=r.result; inspect(r.result);}; r.readAsText(f); };
$('#search').oninput=e=>{ STATE.q=e.target.value.trim().toLowerCase(); if(STATE.crds.length) draw(); };
$('#tgAll').onclick=()=>{ STATE.mode='all'; $('#tgAll').classList.add('on'); $('#tgReq').classList.remove('on'); if(STATE.crds.length)draw(); };
$('#tgReq').onclick=()=>{ STATE.mode='req'; $('#tgReq').classList.add('on'); $('#tgAll').classList.remove('on'); if(STATE.crds.length)draw(); };
$('#mfMin').onclick=()=>{ STATE.manifestMode='minimal'; if(STATE.crds.length)draw(); };
$('#mfAll').onclick=()=>{ STATE.manifestMode='full'; if(STATE.crds.length)draw(); };
$('#copyYaml').onclick=()=>{ const crd=STATE.crds[STATE.ci]; copy(buildManifest(crd,crd.versions[STATE.vi],STATE.manifestMode),'Manifest copied'); };
$('#copyList').onclick=()=>{ const crd=STATE.crds[STATE.ci]; const t=crd.versions[STATE.vi].tree; if(!t)return; copy(requiredLeaves(t).map(n=>n.path+'  ('+n.type+')').join('\n'),'List copied'); };

const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.remove('hot');}));
drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{$('#src').value=r.result; inspect(r.result);}; r.readAsText(f); });
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') inspect($('#src').value); });

const SAMPLE = `apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crontabs.stable.example.com
spec:
  group: stable.example.com
  names:
    kind: CronTab
    plural: crontabs
    singular: crontab
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [cronSpec, image, replicas]
              properties:
                cronSpec:
                  type: string
                  description: "Cron format schedule"
                  pattern: '^(\\d+|\\*)(/\\d+)?(\\s+(\\d+|\\*)(/\\d+)?){4}$'
                image:
                  type: string
                  description: "Container image to run"
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                resources:
                  type: object
                  required: [limits]
                  properties:
                    limits:
                      type: object
                      required: [cpu]
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                volumes:
                  type: array
                  items:
                    type: object
                    required: [name, path]
                    properties:
                      name:
                        type: string
                      path:
                        type: string
                      readOnly:
                        type: boolean
`;
</script>
</body>
</html>
